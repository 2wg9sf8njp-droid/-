<style>
:root {
  --green: #1E4D3B;
  --green-l: #3C6E58;
  --pale: #C9DED2;
  --red: #C43E2F;
  --gold: #B8860B;
  --gold-bg: #F3E9D2;
  --paper: #F7F6F1;
  --ink: #26241F;
  --muted: #6D6A60;
  --rule: #DDD9CC;
  --white: #ffffff;

  --serif: "Hiragino Mincho ProN", "Yu Mincho", serif;
  --sans: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Hiragino Sans", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: #EAEAE4;
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
}

#app {
  max-width: 460px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--paper);
  display: flex;
  flex-direction: column;
}

/* ---------- ヘッダー ---------- */
.app-header {
  background: var(--green);
  color: #fff;
  padding: 20px 20px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.app-header .eyebrow { font-size: 11px; letter-spacing: 2px; color: var(--pale); margin: 0 0 2px; }
.app-header .date { font-family: var(--serif); font-size: 18px; font-weight: 700; margin: 0; }
.stamp {
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--red); border-radius: 999px; color: var(--red);
  font-family: var(--serif); font-weight: 700; flex-shrink: 0;
}

/* ---------- コンテンツ ---------- */
.content { flex: 1; padding: 18px 18px 90px; overflow-y: auto; }
.view { display: none; }
.view.active { display: block; }

/* ---------- カード ---------- */
.card {
  background: #fff; border: 1px solid var(--rule); border-radius: 16px;
  padding: 16px; margin-bottom: 14px;
}
.card-hero { background: var(--green); border-radius: 16px; padding: 16px; margin-bottom: 14px; color: #fff; }
.card-title { font-family: var(--serif); font-size: 15px; font-weight: 700; color: var(--green); margin: 0 0 10px; }
.card-title.on-hero { color: #fff; }
.muted { color: var(--muted); font-size: 12px; }
.muted-sm { color: var(--muted); font-size: 11px; }

/* ---------- ボタン ---------- */
.btn { border: none; border-radius: 14px; padding: 12px; font-weight: 700; font-size: 14px; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn-green { background: var(--green); color: #fff; }
.btn-red { background: var(--red); color: #fff; }
.btn-gold { background: var(--gold); color: #fff; }
.btn-outline { background: #fff; color: var(--green); border: 1px solid var(--rule); }
.btn-sm { padding: 8px; font-size: 12px; border-radius: 10px; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ---------- チップ ---------- */
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #fff; color: var(--ink); border: 1px solid var(--rule); cursor: pointer; }
.chip.active { background: var(--green); color: #fff; border-color: var(--green); }
.chip.accent-active { background: var(--red); color: #fff; border-color: var(--red); }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-right: 4px; }
.tag-strong { background: var(--green); color: #fff; }
.tag-mid { background: var(--pale); color: var(--green); }
.tag-weak { background: var(--rule); color: var(--muted); }
.impact-chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; margin: 0 6px 6px 0; }
.impact-down { background: var(--pale); color: var(--green); }
.impact-up { background: var(--gold-bg); color: var(--gold); }

/* ---------- フォーム ---------- */
input[type=text], input[type=number], textarea, select {
  width: 100%; border: 1px solid var(--rule); border-radius: 12px; padding: 10px 12px;
  font-size: 14px; font-family: var(--sans); color: var(--ink); background: #fff;
}
textarea { resize: vertical; }
.field-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: block; }
.field-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.field-3col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

/* ---------- セグメントタブ ---------- */
.seg { display: flex; background: var(--rule); border-radius: 999px; padding: 4px; margin-bottom: 14px; }
.seg button { flex: 1; background: none; border: none; border-radius: 999px; padding: 7px 0; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button.active { background: var(--green); color: #fff; }
.seg.accent button.active { background: var(--red); }

/* ---------- プログレスバー ---------- */
.progress-row { margin-bottom: 12px; }
.progress-labels { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
.progress-track { height: 8px; border-radius: 999px; background: var(--rule); overflow: hidden; }
.progress-fill { height: 100%; border-radius: 999px; background: var(--green); }
.progress-fill.bad { background: var(--red); }
.progress-track.on-hero { background: rgba(255,255,255,.25); }
.progress-fill.on-hero { background: #fff; }

/* ---------- リスト行 ---------- */
.row { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid var(--rule); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
.row .amount { font-weight: 700; color: var(--green); }
.timeline-row { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--rule); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
.timeline-row .body { flex: 1; min-width: 0; }
.timeline-row .body p { margin: 0; }
.timeline-row .title { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- カレンダー ---------- */
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 12px; }
.calendar-cell { aspect-ratio: 1 / 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; border: 1px solid transparent; cursor: pointer; }
.calendar-cell.today { border-color: var(--red); }
.calendar-cell.selected { border-color: var(--green); }

/* ---------- 年次バー ---------- */
.year-bars { display: flex; align-items: flex-end; gap: 4px; height: 140px; margin-bottom: 8px; }
.year-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 130px; }
.year-bar { width: 100%; border-radius: 4px 4px 0 0; background: var(--pale); }
.year-bar.current { background: var(--red); }

/* ---------- 提案カード ---------- */
.candidate { border: 1px solid var(--rule); border-radius: 16px; padding: 14px; margin-bottom: 10px; background: #fff; cursor: pointer; }
.candidate.committed { background: var(--pale); border-color: var(--green); }
.candidate .top { display: flex; align-items: flex-start; gap: 10px; }
.candidate .title { font-size: 14px; font-weight: 700; margin: 0 0 6px; display: flex; align-items: center; gap: 4px; }
.candidate .reason { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
.candidate input[type=checkbox] { margin-top: 3px; width: 16px; height: 16px; flex-shrink: 0; }

/* ---------- 予定行 ---------- */
.schedule-row { background: #fff; border: 1px solid var(--rule); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
.schedule-row .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.schedule-row .top select { width: auto; font-size: 12px; padding: 5px 8px; }
.schedule-row .date-label { font-weight: 700; font-size: 13px; }

/* ---------- ボトムナビ ---------- */
.bottom-nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 460px; background: #fff; border-top: 1px solid var(--rule);
  display: flex; padding-bottom: env(safe-area-inset-bottom, 0px);
}
.bottom-nav button {
  flex: 1; background: none; border: none; padding: 10px 0 8px; display: flex;
  flex-direction: column; align-items: center; gap: 3px; color: var(--muted); cursor: pointer;
}
.bottom-nav button.active { color: var(--red); }
.bottom-nav svg { width: 20px; height: 20px; }
.bottom-nav .label { font-size: 10px; font-weight: 700; }

/* ---------- トースト ---------- */
#toast {
  position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px;
  font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s;

<script>
// ============================================================
// data.js
// ============================================================
/**
 * data.js — アプリ全体の定数
 * 実際に運用している家計簿アプリの費目一覧に合わせている。
 */

const MAIN_CATEGORIES = [
  "家賃", "交通費", "娯楽", "娯楽用コンビニ&自販機", "自炊用食品", "コンビニご飯(朝昼)",
  "昼外食", "夜外食", "交際費(会合)", "交際費(贈物)", "日用品",
  "教育費", "社用費", "特別費", "通信費", "衣服", "光熱費", "美容", "医療費", "貯金",
];

const INCOME_LABELS = ["給与", "賞与", "副収入", "その他"];

const SCHEDULE_TYPES = ["出社", "在宅勤務", "休日", "残業", "飲み会", "デート", "旅行", "通院", "買い物", "趣味", "運動", "イベント", "その他"];

window.APP_DATA = { MAIN_CATEGORIES, INCOME_LABELS, SCHEDULE_TYPES };


// ============================================================
// db.js
// ============================================================
/**
 * db.js — 永続化レイヤー(IndexedDB)
 *
 * 設計方針(PC版のSQLiteと同じ考え方を踏襲):
 *  - スキーマ変更は「加算のみ」。onupgradeneeded では既存のオブジェクトストアを
 *    削除・リネームせず、足りないものだけ追加する。バージョンを上げても
 *    既存データは失われない。
 *  - 「今どのバージョンのアプリを使っていても、古いデータを読み込める」ことを
 *    最優先する。
 *
 * ストア構成:
 *  - kv            : 単一設定値(goals/profile/apiKey/fixedCosts/categoryBudgets/
 *                     schedule/planCandidates/committedWeek/pastCommits/feedbackLog)
 *  - expenses      : 支出明細 { id, category, amount, memo, dateISO, monthKey }
 *  - incomes       : 収入明細 { id, label, amount, dateISO, monthKey }
 *  - meals         : 食事記録 { id, text, kcal, protein, fat, carbs, salt, note, dateISO, monthKey }
 */

const DB_NAME = "lifecoach_db";
const DB_VERSION = 1;

let _dbPromise = null;

function openDB() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);

    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      // 加算のみ: 既にあるストアには触れない。無ければ作る。
      if (!db.objectStoreNames.contains("kv")) {
        db.createObjectStore("kv", { keyPath: "key" });
      }
      if (!db.objectStoreNames.contains("expenses")) {
        const s = db.createObjectStore("expenses", { keyPath: "id", autoIncrement: true });
        s.createIndex("monthKey", "monthKey", { unique: false });
      }
      if (!db.objectStoreNames.contains("incomes")) {
        const s = db.createObjectStore("incomes", { keyPath: "id", autoIncrement: true });
        s.createIndex("monthKey", "monthKey", { unique: false });
      }
      if (!db.objectStoreNames.contains("meals")) {
        const s = db.createObjectStore("meals", { keyPath: "id", autoIncrement: true });
        s.createIndex("monthKey", "monthKey", { unique: false });
        s.createIndex("dateISO", "dateISO", { unique: false });
      }
      // 将来バージョンを上げるときは、ここに「無ければ追加」を足していくだけにする。
    };

    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _dbPromise;
}

function tx(storeName, mode = "readonly") {
  return openDB().then((db) => db.transaction(storeName, mode).objectStore(storeName));
}

function wrap(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

// ---------------- kv(単一設定値) ----------------

const KV_DEFAULTS = {
  goals: { targetKcal: 2000, proteinRatio: 20, fatRatio: 25, carbsRatio: 55, savingsTarget: 30000 },
  profile: { age: "", height: "", weight: "", targetWeight: "", rules: "" },
  apiKey: "",
  fixedCosts: [],
  categoryBudgets: {},
  schedule: null, // null なら初回起動時に来週分を生成する
  scheduleWeekStart: null, // どの週の予定かを識別するためのISO日付(日曜)
  planCandidates: [],
  committedWeek: [],
  pastCommits: [],
  feedbackLog: [],
};

async function kvGet(key) {
  const store = await tx("kv");
  const row = await wrap(store.get(key));
  if (row) return row.value;
  return KV_DEFAULTS.hasOwnProperty(key) ? KV_DEFAULTS[key] : undefined;
}

async function kvSet(key, value) {
  const store = await tx("kv", "readwrite");
  await wrap(store.put({ key, value }));
  return value;
}

// ---------------- 明細系(expenses / incomes / meals) ----------------

function monthKeyOf(dateISO) {
  return dateISO.slice(0, 7); // "YYYY-MM"
}
function todayISO() {
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}

async function addExpense({ category, amount, memo }) {
  const dateISO = todayISO();
  const store = await tx("expenses", "readwrite");
  const record = { category, amount, memo: memo || "", dateISO, monthKey: monthKeyOf(dateISO), createdAt: Date.now() };
  const id = await wrap(store.add(record));
  return { ...record, id };
}
async function addIncome({ label, amount }) {
  const dateISO = todayISO();
  const store = await tx("incomes", "readwrite");
  const record = { label, amount, dateISO, monthKey: monthKeyOf(dateISO), createdAt: Date.now() };
  const id = await wrap(store.add(record));
  return { ...record, id };
}
async function addMeal({ text, kcal, protein, fat, carbs, salt, note }) {
  const dateISO = todayISO();
  const store = await tx("meals", "readwrite");
  const record = { text, kcal, protein, fat, carbs, salt, note, dateISO, monthKey: monthKeyOf(dateISO), createdAt: Date.now() };
  const id = await wrap(store.add(record));
  return { ...record, id };
}

async function getByMonth(storeName, monthKey) {
  const store = await tx(storeName);
  const idx = store.index("monthKey");
  const rows = await wrap(idx.getAll(monthKey));
  return rows.sort((a, b) => b.createdAt - a.createdAt);
}
async function getByDate(storeName, dateISO) {
  const rows = await getByMonth(storeName, monthKeyOf(dateISO));
  return rows.filter((r) => r.dateISO === dateISO);
}
async function getAllRows(storeName) {
  const store = await tx(storeName);
  return wrap(store.getAll());
}

// ---------------- エクスポート/インポート(バックアップ) ----------------

async function exportAllData() {
  const [expenses, incomes, meals] = await Promise.all([
    getAllRows("expenses"), getAllRows("incomes"), getAllRows("meals"),
  ]);
  const kv = {};
  for (const key of Object.keys(KV_DEFAULTS)) {
    kv[key] = await kvGet(key);
  }
  return { schema: "life-coach-mobile.v1", exportedAt: new Date().toISOString(), kv, expenses, incomes, meals };
}

async function importAllData(payload) {
  if (!payload || payload.schema !== "life-coach-mobile.v1") {
    throw new Error("このファイルは統合ライフコーチのバックアップ形式ではありません");
  }
  for (const [key, value] of Object.entries(payload.kv || {})) {
    await kvSet(key, value);
  }
  for (const storeName of ["expenses", "incomes", "meals"]) {
    const store = await tx(storeName, "readwrite");
    await wrap(store.clear());
    for (const record of payload[storeName] || []) {
      const { id, ...rest } = record;
      await wrap(store.add(rest));
    }
  }
}

window.DB = {
  kvGet, kvSet, addExpense, addIncome, addMeal,
  getByMonth, getByDate, getAllRows,
  monthKeyOf, todayISO,
  exportAllData, importAllData,
};


// ============================================================
// ai.js
// ============================================================
/**
 * ai.js — Anthropic APIをブラウザから直接呼び出す層。
 *
 * 重要: このアプリにはサーバーが無いため、APIキーはこの端末の中(IndexedDB)にのみ
 * 保存され、呼び出しのたびにブラウザから直接 api.anthropic.com へ送られる。
 * 「anthropic-dangerous-direct-browser-access」ヘッダーは、ブラウザから直接
 * 呼び出していることをAnthropic側に明示するためのもの(仕様上必須)。
 *
 * キーの安全性については README / 設定タブに明記のとおり、
 *  - このキーでの利用上限額をAnthropicコンソール側で必ず設定すること
 *  - 端末を他人と共有しないこと
 * を前提とする。
 */

const AI_MODEL = "claude-sonnet-4-6"; // 変更したい場合はここを書き換える

class AIError extends Error {}

async function callClaude(prompt, apiKey, maxTokens = 1000) {
  if (!apiKey) {
    throw new AIError("APIキーが設定されていません。設定タブで入力してください。");
  }
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: AI_MODEL,
        max_tokens: maxTokens,
        messages: [{ role: "user", content: prompt }],
      }),
    });
  } catch (e) {
    throw new AIError("通信できませんでした。インターネット接続を確認してください。");
  }
  if (!res.ok) {
    let msg = `APIエラー(${res.status})`;
    try {
      const body = await res.json();
      if (body?.error?.message) msg = body.error.message;
      if (res.status === 401) msg = "APIキーが正しくないようです。設定タブを確認してください。";
      if (res.status === 429) msg = "利用上限に達しました。しばらく待つか、Anthropicコンソールで上限を確認してください。";
    } catch (_) { /* ignore */ }
    throw new AIError(msg);
  }
  const data = await res.json();
  const text = (data.content || []).map((b) => (b.type === "text" ? b.text : "")).join("\n").trim();
  return text.replace(/```json/g, "").replace(/```/g, "").trim();
}

async function callClaudeJSON(prompt, apiKey, maxTokens = 1000) {
  const text = await callClaude(prompt, apiKey, maxTokens);
  try {
    return JSON.parse(text);
  } catch (e) {
    throw new AIError("AIの応答をうまく読み取れませんでした。もう一度試してください。");
  }
}

// ---------------- 栄養推定 ----------------

async function estimateNutrition(mealText, apiKey) {
  const prompt =
    `以下の食事内容から栄養価を推定し、JSON形式のみで出力してください。前置き・説明・コードブロック記号は一切書かないでください。\n\n` +
    `食事内容:「${mealText}」\n\n` +
    `出力形式(数値は単位を含めない):\n{"kcal":数値,"protein":数値,"fat":数値,"carbs":数値,"salt":数値,"note":"分量の想定など短い一言"}\n\n` +
    `分量が不明な場合は一般的な標準量を仮定してよいので、必ず数値を返し、noteに前提を書いてください。`;
  return callClaudeJSON(prompt, apiKey, 600);
}

// ---------------- 来週プランの生成・微修正 ----------------

function categoryListText() {
  return APP_DATA.MAIN_CATEGORIES.filter((c) => c !== "貯金").join("、");
}

async function generatePlanCandidates(context, apiKey) {
  const prompt =
    `あなたは家計と食事の両方を見るコーチです。以下の情報をもとに、来週の行動プランを3つ提案してください。` +
    `効果の高さと実行しやすさの両方を考慮し、片方だけが高いものより両方バランスが良いものを優先してください。` +
    `各施策について、どの費目にどれくらいの金額の変化が起きるかを必ず明示してください` +
    `(例: 外食を2回自炊に置き換える → 夜外食を3000円減らし、自炊用食品を2000円増やす)。` +
    `費目名は必ず次の一覧の表記のままいずれかを使い、一覧にない名前や独自の略称は使わないでください: ${categoryListText()}。` +
    `金額はあくまで現時点での見立てで構いません。断定はせず、振り返りが積み重なるほど精度が上がっていく前提で構いません。` +
    `特に「費目別の予算消化」で予算を超えそうな費目があれば、そこを改善する提案を優先してください。` +
    `過去の振り返りで「難しかった」とされた傾向は避け、「できた」ものは強化する方向で考えてください。` +
    `「絶対に守るルール」に反する提案は絶対に行わないでください。断定的な健康アドバイスは避けてください。\n\n` +
    `情報: ${JSON.stringify(context)}\n\n` +
    `出力はJSON形式のみ。前置き・コードブロック記号は書かないでください。\n` +
    `出力形式:\n{"candidates":[{"title":"施策名(20字以内)","effect":"高|中|低","ease":"高|中|低","reason":"理由(50字以内)",` +
    `"impacts":[{"category":"費目名(一覧の表記のまま)","delta":円(減少は負の数、増加は正の数)}]}]}` +
    `※candidatesは3件、効果と実行しやすさのバランスが良い順。impactsは1〜3件程度で、費目名は一覧の表記と完全に一致させること。`;
  const result = await callClaudeJSON(prompt, apiKey, 1200);
  return result.candidates || [];
}

async function refinePlanCandidates(currentCandidates, comment, context, apiKey) {
  const current = currentCandidates.map(({ title, effect, ease, reason, impacts }) => ({ title, effect, ease, reason, impacts }));
  const prompt =
    `以下は来週の行動プランの現在の提案です。ユーザーからのコメントを踏まえて、提案を微修正してください。` +
    `コメントに関係ない案はそのまま残して構いません。全体を作り直す必要はありません。` +
    `各案には引き続き、どの費目にどれくらいの金額の変化が起きるかを明示してください。` +
    `費目名は必ず次の一覧の表記のままいずれかを使ってください: ${categoryListText()}。` +
    `「絶対に守るルール」に反する内容には絶対にしないでください。断定的な健康アドバイスは避けてください。\n\n` +
    `背景情報: ${JSON.stringify(context)}\n\n` +
    `現在の提案: ${JSON.stringify(current)}\n\n` +
    `ユーザーのコメント: 「${comment}」\n\n` +
    `出力はJSON形式のみ。前置き・コードブロック記号は書かないでください。\n` +
    `出力形式:\n{"candidates":[{"title":"施策名(20字以内)","effect":"高|中|低","ease":"高|中|低","reason":"理由(50字以内)",` +
    `"impacts":[{"category":"費目名(一覧の表記のまま)","delta":円(減少は負の数、増加は正の数)}]}]}`;
  const result = await callClaudeJSON(prompt, apiKey, 1200);
  return result.candidates || [];
}

window.AI = { AIError, callClaude, callClaudeJSON, estimateNutrition, generatePlanCandidates, refinePlanCandidates };


// ============================================================
// app.js
// ============================================================
/**
 * app.js — 統合ライフコーチ(スマホ版) v1.0.0
 * すべてのデータは DB.*(IndexedDB)に保存され、この端末の中だけに残る。
 */

// ==================== ユーティリティ ====================

function yen(n) {
  const v = Math.round(Number(n) || 0);
  return `¥${v.toLocaleString()}`;
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2600);
}
function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function isoDate(d) {
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}
function nextWeekDates() {
  const today = new Date();
  const offset = ((7 - today.getDay()) % 7) || 7;
  const start = new Date(today);
  start.setDate(today.getDate() + offset);
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    return d;
  });
}
function formatDateLabel(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("ja-JP", { month: "numeric", day: "numeric", weekday: "short" });
}
function toneClass(level) {
  return level === "高" ? "tag-strong" : level === "中" ? "tag-mid" : "tag-weak";
}
function impactChipsHTML(impacts) {
  if (!impacts || !impacts.length) return "";
  return impacts.map((imp) => {
    const cls = imp.delta < 0 ? "impact-down" : "impact-up";
    const sign = imp.delta > 0 ? "+" : "";
    return `<span class="impact-chip ${cls}">${escapeHTML(imp.category)} ${sign}${Number(imp.delta).toLocaleString()}円</span>`;
  }).join("");
}
function escapeHTML(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function heatColor(amount, max) {
  const ratio = max > 0 ? Math.min(1, amount / max) : 0;
  const from = [201, 222, 210], to = [30, 77, 59];
  const rgb = from.map((f, i) => Math.round(f + (to[i] - f) * ratio));
  return { bg: `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`, light: ratio <= 0.55 };
}
function prevMonthKey(monthKey) {
  const [y, m] = monthKey.split("-").map(Number);
  const py = m === 1 ? y - 1 : y;
  const pm = m === 1 ? 12 : m - 1;
  return `${py}-${String(pm).padStart(2, "0")}`;
}

// ==================== 初期化・週の巡回 ====================

async function checkWeekRollover() {
  const storedStart = await DB.kvGet("scheduleWeekStart");
  if (!storedStart) {
    const nd = nextWeekDates();
    const schedule = nd.map((d) => ({ date: isoDate(d), type: "", cookOk: true, lateHome: false, drink: false, special: false }));
    await DB.kvSet("schedule", schedule);
    await DB.kvSet("scheduleWeekStart", isoDate(nd[0]));
    return;
  }
  const startD = new Date(storedStart + "T00:00:00");
  const endD = new Date(startD);
  endD.setDate(startD.getDate() + 6);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  if (today > endD) {
    // 保管していた「来週の予定」の週がもう終わっている → 振り返り対象へ回し、次の週を用意する
    const committed = (await DB.kvGet("committedWeek")) || [];
    if (committed.length) {
      const existingPast = (await DB.kvGet("pastCommits")) || [];
      const moved = committed.map((c) => ({ ...c, status: null }));
      await DB.kvSet("pastCommits", [...existingPast, ...moved]);
      await DB.kvSet("committedWeek", []);
    }
    const nd = nextWeekDates();
    const schedule = nd.map((d) => ({ date: isoDate(d), type: "", cookOk: true, lateHome: false, drink: false, special: false }));
    await DB.kvSet("schedule", schedule);
    await DB.kvSet("scheduleWeekStart", isoDate(nd[0]));
    await DB.kvSet("planCandidates", []);
  }
}

function progressRowHTML(label, actual, target, unit, badWhenOver) {
  const pct = target > 0 ? Math.round((actual / target) * 100) : 0;
  const over = target > 0 && actual > target * 1.15;
  return `
    <div class="progress-row">
      <div class="progress-labels"><span>${label}</span><span class="muted">${Math.round(actual).toLocaleString()}${unit} / ${Math.round(target).toLocaleString()}${unit}</span></div>
      <div class="progress-track"><div class="progress-fill ${badWhenOver && over ? "bad" : ""}" style="width:${Math.min(100, pct)}%"></div></div>
    </div>`;
}

async function renderBudgetMonthly(body) {

  const monthLabel = new Date().toLocaleDateString("ja-JP", { year: "numeric", month: "long" });
  const [expenses, incomes, fixedCosts, goals, categoryBudgets, committedWeek] = await Promise.all([
    DB.getByMonth("expenses", monthKey), DB.getByMonth("incomes", monthKey), DB.kvGet("fixedCosts"),
    DB.kvGet("goals"), DB.kvGet("categoryBudgets"), DB.kvGet("committedWeek"),
  ]);
  const totalIncome = incomes.reduce((s, i) => s + i.amount, 0);
  const totalSavings = expenses.filter((e) => e.category === "貯金").reduce((s, e) => s + e.amount, 0);
  const totalFixed = fixedCosts.reduce((s, f) => s + f.amount, 0);
  const totalVariable = expenses.filter((e) => e.category !== "貯金").reduce((s, e) => s + e.amount, 0);
  const leftover = totalIncome - totalFixed - totalVariable - totalSavings;
  const savingsPct = goals.savingsTarget > 0 ? Math.round((totalSavings / goals.savingsTarget) * 100) : 0;

  const committedCats = new Set(committedWeek.flatMap((c) => (c.impacts || []).map((i) => i.category)));
  const budgetedCats = Object.keys(categoryBudgets).filter((c) => categoryBudgets[c] > 0)
    .sort((a, b) => (committedCats.has(a) ? 0 : 1) - (committedCats.has(b) ? 0 : 1));

  const dayTotals = {};
  expenses.filter((e) => e.category !== "貯金").forEach((e) => {
    const day = Number(e.dateISO.slice(8, 10));
    dayTotals[day] = (dayTotals[day] || 0) + e.amount;
  });
  const maxDay = Math.max(1, ...Object.values(dayTotals));
  const daysInMonth = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
  const todayDate = new Date().getDate();

  body.innerHTML = `
    <div class="card-hero">
      <p class="muted" style="color:var(--pale);margin:0 0 4px">今月の貯金目標</p>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px">
        <p style="font-family:var(--serif);font-size:28px;font-weight:700;margin:0">${yen(totalSavings)}</p>
        <p style="color:var(--pale);margin:0">/ ${yen(goals.savingsTarget)}</p>
      </div>
      <div class="progress-track on-hero"><div class="progress-fill on-hero" style="width:${Math.min(100, savingsPct)}%"></div></div>
      <p class="muted" style="color:var(--pale);margin:8px 0 0">達成率 ${savingsPct}%</p>
    </div>

    <div class="card">
      <p class="card-title">${monthLabel}の収支</p>
      <div style="font-size:13px;margin-bottom:10px">
        <div class="progress-labels"><span class="muted">収入</span><span>${yen(totalIncome)}</span></div>
        <div class="progress-labels"><span class="muted">固定費</span><span>${yen(totalFixed)}</span></div>
        <div class="progress-labels"><span class="muted">変動費</span><span>${yen(totalVariable)}</span></div>
        <div class="progress-labels"><span class="muted">貯金</span><span>${yen(totalSavings)}</span></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--rule)">
        <span style="font-weight:700;font-size:13px">今月の余剰</span>
        <span style="font-family:var(--serif);font-size:18px;font-weight:700;color:${leftover >= 0 ? "var(--green)" : "var(--red)"}">${leftover >= 0 ? "+" : ""}${yen(leftover)}</span>
      </div>
    </div>

    <div class="card">
      <p class="card-title">費目別の予算消化率</p>
      ${budgetedCats.length === 0
        ? `<p class="muted" style="text-align:center;padding:10px 0">「予算」タブで来月の予算を費目ごとに決めると、ここに消化率が表示されます。</p>`
        : budgetedCats.map((c) => {
            const budget = categoryBudgets[c] || 0;
            const actual = expenses.filter((e) => e.category === c).reduce((s, e) => s + e.amount, 0);
            const pct = budget > 0 ? Math.round((actual / budget) * 100) : 0;
            const isCommitted = committedCats.has(c);
            const barColor = pct >= 100 ? "var(--red)" : isCommitted ? "var(--gold)" : "var(--green)";
            return `
              <div class="progress-row">
                <div class="progress-labels">
                  <span>${escapeHTML(c)} ${isCommitted ? `<span class="tag tag-strong">コミット中</span>` : ""}</span>

              </div>`;
          }).join("")}

    <p class="muted" style="font-weight:700;margin:0 0 8px">${monthLabel}のカレンダー(変動費)</p>
    <div class="calendar-grid" id="cal-grid"></div>
    <div class="card" id="day-detail"></div>
  `;

  const grid = body.querySelector("#cal-grid");
  for (let d = 1; d <= daysInMonth; d++) {
    const amt = dayTotals[d] || 0;
    const { bg, light } = heatColor(amt, maxDay);
    const cell = el(`<button class="calendar-cell ${d === todayDate ? "today" : ""} ${d === selectedDay ? "selected" : ""}" style="background:${bg};color:${light ? "var(--ink)" : "#fff"}">${d}</button>`);
    cell.onclick = () => { selectedDay = d; renderBudgetMonthly(body); };

  const detail = body.querySelector("#day-detail");
  const dayExpenses = expenses.filter((e) => e.category !== "貯金" && Number(e.dateISO.slice(8, 10)) === selectedDay);
  detail.innerHTML = `<p class="muted-sm" style="margin:0 0 6px">${selectedDay}日</p>` +

      ? `<p class="muted-sm" style="margin:0">記録がありません。</p>`
      : dayExpenses.map((e) => `<div class="progress-labels"><span>${escapeHTML(e.category)}</span><span style="color:var(--green)">${yen(e.amount)}</span></div>`).join(""));
}

async function renderBudgetYearly(body) {
  const now = new Date();
  const months = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const mk = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    const rows = await DB.getByMonth("expenses", mk);
    const variable = rows.filter((r) => r.category !== "貯金").reduce((s, r) => s + r.amount, 0);
    months.push({ label: `${d.getMonth() + 1}月`, variable, isCurrent: i === 0 });
  }
  const maxAmt = Math.max(1, ...months.map((m) => m.variable));
  body.innerHTML = `
    <p class="muted" style="margin:0 0 10px">直近12か月の変動費(固定費は含みません)</p>
    <div class="year-bars">
      ${months.map((m) => {
        const h = Math.max(4, Math.round((m.variable / maxAmt) * 130));
        return `<div class="year-bar-col"><div class="year-bar ${m.isCurrent ? "current" : ""}" style="height:${h}px"></div><p class="muted-sm" style="margin:4px 0 0">${m.label}</p></div>`;
      }).join("")}
    </div>
  `;
}

let planView = "propose";
let refineComment = "";

async function renderPlan(container) {
  container.innerHTML = `
    <div class="seg" id="plan-seg">
      <button data-v="schedule">予定</button><button data-v="propose">提案</button><button data-v="review">振り返り</button>

  else if (planView === "propose") await renderPlanPropose(body);

}

async function buildPlanContext() {
  const [schedule, meals, goals, expenses, incomes, fixedCosts, categoryBudgets, feedbackLog, profile] = await Promise.all([
    DB.kvGet("schedule"), DB.getByMonth("meals", DB.monthKeyOf(DB.todayISO())), DB.kvGet("goals"),
    DB.getByMonth("expenses", DB.monthKeyOf(DB.todayISO())), DB.getByMonth("incomes", DB.monthKeyOf(DB.todayISO())),
    DB.kvGet("fixedCosts"), DB.kvGet("categoryBudgets"), DB.kvGet("feedbackLog"), DB.kvGet("profile"),
  ]);
  const todayMeals = await DB.getByDate("meals", DB.todayISO());
  const actualKcal = todayMeals.reduce((s, m) => s + (Number(m.kcal) || 0), 0);
  const actualProtein = todayMeals.reduce((s, m) => s + (Number(m.protein) || 0), 0);
  const targetProteinG = Math.round((goals.targetKcal * goals.proteinRatio) / 100 / 4);
  const totalIncome = incomes.reduce((s, i) => s + i.amount, 0);
  const totalSavings = expenses.filter((e) => e.category === "貯金").reduce((s, e) => s + e.amount, 0);
  const totalFixed = fixedCosts.reduce((s, f) => s + f.amount, 0);
  const totalVariable = expenses.filter((e) => e.category !== "貯金").reduce((s, e) => s + e.amount, 0);
  const leftover = totalIncome - totalFixed - totalVariable - totalSavings;
  const budgetSummary = Object.keys(categoryBudgets).filter((c) => categoryBudgets[c] > 0).map((c) => ({
    費目: c, 予算: categoryBudgets[c], 実績: expenses.filter((e) => e.category === c).reduce((s, e) => s + e.amount, 0),
  }));
  return {
    来週の予定: schedule.map((s) => ({ 日: formatDateLabel(s.date), 予定: s.type || "なし", 自炊可: s.cookOk, 遅帰宅: s.lateHome, 飲酒: s.drink, 特別: s.special })),
    今週の食事: { 記録数: todayMeals.length, 実績kcal: actualKcal, 目標kcal: goals.targetKcal, 実績たんぱく質: actualProtein, 目標たんぱく質: targetProteinG },
    今月の収支: { 収入: totalIncome, 固定費: totalFixed, 変動費: totalVariable, 貯金: totalSavings, 貯金目標: goals.savingsTarget, 余剰: leftover },
    費目別の予算消化: budgetSummary,
    過去の振り返り: feedbackLog,
    絶対に守るルール: profile.rules || "特になし",
  };
}

async function renderPlanPropose(body) {
  const candidates = await DB.kvGet("planCandidates");
  body.innerHTML = `
    <button class="btn btn-green" id="plan-generate" style="margin-bottom:12px">${candidates.length ? "提案をゼロから作り直す" : "来週のプランを作る"}</button>
    <div id="plan-error"></div>
    <div id="plan-candidates"></div>
  `;
  renderCandidateList(body, candidates);

  body.querySelector("#plan-generate").onclick = async () => {
    const btn = body.querySelector("#plan-generate");
    btn.disabled = true; btn.textContent = "考え中…";
    body.querySelector("#plan-error").innerHTML = "";
    try {
      const apiKey = await DB.kvGet("apiKey");
      const context = await buildPlanContext();
      const result = await AI.generatePlanCandidates(context, apiKey);
      const withIds = result.map((c) => ({ ...c, id: Date.now() + Math.random(), committed: false }));
      await DB.kvSet("planCandidates", withIds);
      refineComment = "";
      renderCandidateList(body, withIds);
      toast("提案を作りました");
    } catch (e) {
      body.querySelector("#plan-error").innerHTML = `<p class="issue">${escapeHTML(e.message)}</p>`;
    }
    btn.disabled = false; btn.textContent = "提案をゼロから作り直す";
  };
}

function renderCandidateList(body, candidates) {
  const box = body.querySelector("#plan-candidates");
  if (!candidates.length) {
    box.innerHTML = `<div class="empty-box"><span>予定・食事・支出・予算・プロフィールを記録してから作ると、より具体的な提案になります。</span></div>`;
    return;
  }
  box.innerHTML = candidates.map((c) => `
    <label class="candidate ${c.committed ? "committed" : ""}" data-id="${c.id}">
      <div class="top">
        <input type="checkbox" class="commit-box" ${c.committed ? "checked" : ""}>
        <div style="flex:1">
          <p class="title">${c.committed ? "✓ " : ""}${escapeHTML(c.title)}</p>
          <div style="margin-bottom:6px">
            <span class="tag ${toneClass(c.effect)}">効果:${c.effect}</span>
            <span class="tag ${toneClass(c.ease)}">実行:${c.ease}</span>
          </div>
          <div>${impactChipsHTML(c.impacts)}</div>
          <p class="reason">${escapeHTML(c.reason)}</p>
        </div>
      </div>
    </label>
  `).join("") + `
    <div class="card">
      <p style="font-weight:700;margin:0 0 6px">コメントで微修正する</p>
      <p class="muted" style="margin:0 0 8px">気になる点をそのまま書いてください。コメントと関係ない案はそのまま残ります。</p>
      <textarea id="refine-text" rows="2" placeholder="例: もっと簡単なものにして。自炊系の提案をもう1つ増やして。" style="margin-bottom:8px">${escapeHTML(refineComment)}</textarea>
      <button class="btn btn-gold" id="refine-btn">このコメントで作り直す</button>
      <div id="refine-error"></div>
    </div>
    <button class="btn btn-red" id="commit-btn">チェックした内容でコミットする</button>
  `;

  box.querySelectorAll(".commit-box").forEach((cb) => {
    cb.onchange = async () => {
      const cands = await DB.kvGet("planCandidates");
      const idx = cands.findIndex((c) => String(c.id) === String(cb.closest(".candidate").dataset.id));
      if (idx >= 0) { cands[idx].committed = cb.checked; await DB.kvSet("planCandidates", cands); }
      cb.closest(".candidate").classList.toggle("committed", cb.checked);
    };
  });

  box.querySelector("#refine-text").oninput = (e) => { refineComment = e.target.value; };
  box.querySelector("#refine-btn").onclick = async () => {
    if (!refineComment.trim()) return toast("コメントを入力してください");
    const btn = box.querySelector("#refine-btn");
    btn.disabled = true; btn.textContent = "反映中…";
    box.querySelector("#refine-error").innerHTML = "";
    try {
      const apiKey = await DB.kvGet("apiKey");
      const current = await DB.kvGet("planCandidates");
      const context = await buildPlanContext();
      const result = await AI.refinePlanCandidates(current, refineComment, context, apiKey);
      const withIds = result.map((c) => ({ ...c, id: Date.now() + Math.random(), committed: false }));
      await DB.kvSet("planCandidates", withIds);
      refineComment = "";
      renderCandidateList(body, withIds);
      toast("コメントを反映しました");
    } catch (e) {
      box.querySelector("#refine-error").innerHTML = `<p class="issue">${escapeHTML(e.message)}</p>`;
    }
    btn.disabled = false; btn.textContent = "このコメントで作り直す";
  };

  box.querySelector("#commit-btn").onclick = async () => {
    const cands = await DB.kvGet("planCandidates");
    const chosen = cands.filter((c) => c.committed);
    if (!chosen.length) return toast("チェックした案がありません");
    await DB.kvSet("committedWeek", chosen);
    toast("コミットしました。来週、一緒に振り返りましょう");
  };
}

async function renderPlanReview(body) {
  const [pastCommits, committedWeek] = await Promise.all([DB.kvGet("pastCommits"), DB.kvGet("committedWeek")]);
  body.innerHTML = `
    <p style="font-weight:700;margin:0 0 4px">先週コミットしたこと</p>
    <p class="muted" style="margin:0 0 14px">ここでの回答が、次回のプラン生成に反映されます。想定していた費目・金額も一緒に記録されるので、振り返りを重ねるほど見立ての精度が上がっていきます。</p>
    <div id="past-commits">
      ${pastCommits.length === 0
        ? `<div class="empty-box"><span>まだ振り返る項目がありません。プランをコミットして1週間過ごすと、ここに表示されます。</span></div>`
        : pastCommits.map((p, i) => `
          <div class="card" data-i="${i}">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
              ${p.status ? `<div class="stamp" style="width:26px;height:26px;font-size:10px">${p.status === "done" ? "済" : p.status === "partial" ? "半" : "難"}</div>` : ""}
              <p style="margin:0;font-size:13px">${escapeHTML(p.title)}</p>
            </div>
            <div>${impactChipsHTML(p.impacts)}</div>
            <div class="btn-row" style="grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px">
              <button class="btn ${p.status === "done" ? "btn-green" : "btn-outline"} btn-sm reflect-btn" data-status="done">できた</button>
              <button class="btn ${p.status === "partial" ? "btn-gold" : "btn-outline"} btn-sm reflect-btn" data-status="partial">一部できた</button>
              <button class="btn ${p.status === "hard" ? "btn-red" : "btn-outline"} btn-sm reflect-btn" data-status="hard">難しかった</button>
            </div>
          </div>
        `).join("")}
    </div>
    ${committedWeek.length ? `
      <p class="muted" style="font-weight:700;margin:16px 0 8px">今週コミット中(まだ振り返り対象ではありません)</p>
      ${committedWeek.map((c) => `<div class="card" style="background:var(--pale)"><p style="margin:0 0 4px;font-weight:700;color:var(--green)">${escapeHTML(c.title)}</p>${impactChipsHTML(c.impacts)}</div>`).join("")}
    ` : ""}
  `;

  body.querySelectorAll("#past-commits .card").forEach((card) => {
    const i = Number(card.dataset.i);
    card.querySelectorAll(".reflect-btn").forEach((btn) => {
      btn.onclick = async () => {
        const status = btn.dataset.status;
        const pc = await DB.kvGet("pastCommits");
        pc[i].status = status;
        await DB.kvSet("pastCommits", pc);
        const label = status === "done" ? "できた" : status === "partial" ? "一部できた" : "難しかった";
        const impacts = pc[i].impacts;
        const impactText = impacts && impacts.length ? `(想定: ${impacts.map((im) => `${im.category}${im.delta > 0 ? "+" : ""}${im.delta}円`).join("・")})` : "";
        const log = await DB.kvGet("feedbackLog");
        await DB.kvSet("feedbackLog", [...log, `${pc[i].title}${impactText}: ${label}`]);
        renderPlanReview(body);
      };
    });
  });
}

    <div class="card">
      <p class="card-title">ホーム画面への追加</p>
      <p class="muted">iPhoneは共有ボタン→「ホーム画面に追加」、Androidはメニュー→「アプリをインストール」で、アイコンをタップして起動する形になります。</p>
    </div>

    <div class="card">
      <p class="card-title">費用の目安</p>
      <p class="muted" style="margin:0 0 8px">食事を1日3回記録し、週1〜2回プランを作り直したりコメントで微修正したりする使い方で、月あたりおよそ100〜500円ほどが目安です(2026年7月時点の料金・想定利用量による概算)。</p>
      <p class="muted-sm">実際の金額は使い方によって変わります。上記のAPIキー欄の下にある案内のとおり、利用上限額を設定しておくと安心です。</p>
    </div>

    <div class="card">
      <p class="card-title">バージョン情報</p>
      <p class="muted">統合ライフコーチ(スマホ版) v1.0.0 ・ データはすべてこの端末内に保存されます。</p>
    </div>
  `;

  container.querySelector("#save-apikey").onclick = async () => {
    await DB.kvSet("apiKey", container.querySelector("#set-apikey").value.trim());
    toast("APIキーを保存しました");
  };
  container.querySelectorAll(".fixed-remove").forEach((btn) => {
    btn.onclick = async () => {
      const list = await DB.kvGet("fixedCosts");
      list.splice(Number(btn.dataset.i), 1);
      await DB.kvSet("fixedCosts", list);
      renderSettings(container);
    };
  });
  container.querySelector("#fixed-add").onclick = async () => {
    const cat = container.querySelector("#fixed-cat").value;
    const amt = Number(container.querySelector("#fixed-amount").value);
    if (!amt) return toast("金額を入力してください");
    const list = await DB.kvGet("fixedCosts");
    list.push({ id: Date.now(), category: cat, amount: amt });
    await DB.kvSet("fixedCosts", list);
    renderSettings(container);
  };
  container.querySelector("#save-goals").onclick = async () => {
    await DB.kvSet("goals", {
      targetKcal: Number(container.querySelector("#set-kcal").value) || 0,
      savingsTarget: Number(container.querySelector("#set-savings").value) || 0,
      proteinRatio: Number(container.querySelector("#set-p").value) || 0,
      fatRatio: Number(container.querySelector("#set-f").value) || 0,
      carbsRatio: Number(container.querySelector("#set-c").value) || 0,
    });
    toast("目標を保存しました");
  };
  container.querySelector("#save-profile").onclick = async () => {
    await DB.kvSet("profile", {
      age: container.querySelector("#p-age").value,
      height: container.querySelector("#p-height").value,
      weight: container.querySelector("#p-weight").value,
      targetWeight: container.querySelector("#p-target").value,
      rules: container.querySelector("#p-rules").value,
    });
    toast("プロフィールを保存しました");
  };
  container.querySelector("#export-btn").onclick = async () => {
    const data = await DB.exportAllData();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `life-coach-backup-${DB.todayISO()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  container.querySelector("#import-btn").onclick = async () => {
    const file = container.querySelector("#import-file").files[0];
    const msg = container.querySelector("#backup-msg");
    if (!file) { msg.innerHTML = `<p class="issue">ファイルを選んでください</p>`; return; }
    try {
      const text = await file.text();
      await DB.importAllData(JSON.parse(text));
      msg.innerHTML = `<p class="ok-line">復元しました。ホームタブなどを開き直して確認してください。</p>`;
      toast("復元しました");
    } catch (e) {
      msg.innerHTML = `<p class="issue">${escapeHTML(e.message)}</p>`;
    }
  };
}

// ==================== 起動 ====================

async function init() {
  document.getElementById("header-date").textContent = new Date().toLocaleDateString("ja-JP", { month: "long", day: "numeric", weekday: "short" });
  await checkWeekRollover();
  document.querySelectorAll(".bottom-nav button").forEach((b) => {
    b.onclick = () => switchTab(b.dataset.tab);
  });
  await switchTab("home");

  // 単一ファイル版のためservice worker登録は行わない
}

document.addEventListener("DOMContentLoaded", init);

</script>
</body>
</html>
